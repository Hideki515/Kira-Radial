name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # O Tauri embute o front no binário: dist/ precisa existir antes de compilar o Rust.
      - run: npm run build

      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: cargo clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      # "Kira de teste" (feature qa) precisa compilar e passar no clippy também.
      - name: cargo clippy (feature qa)
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --features qa -- -D warnings

      # O app normal NÃO pode conter os comandos de automação da Kira de teste.
      - name: build normal sem comandos qa_*
        shell: pwsh
        run: |
          cargo build --manifest-path src-tauri/Cargo.toml
          if (Select-String -Path src-tauri/target/debug/kira-radial.exe -Pattern "qa_show_menu" -SimpleMatch -Quiet) {
            Write-Error "o build normal contém comandos da Kira de teste"; exit 1
          }
